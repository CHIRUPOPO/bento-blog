# お弁当の写真を images/ にアップすると、自動で
# 「明るさ補正 → obento.js に追加 → そのままブログに反映」までやる仕組み
name: お弁当を自動でブログに追加

on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - "tools/auto_obento.py"
      - ".github/workflows/auto-obento.yml"
  workflow_dispatch:   # GitHub の「Actions」画面から手動でも動かせる

permissions:
  contents: write
  pages: write

concurrency:
  group: auto-obento

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # いちばん新しい状態で作業する
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      - name: 写真の名前変更・明るさ補正・記録の追加
        id: obento
        run: python3 tools/auto_obento.py

      - name: ブログに反映する（main に保存）
        if: steps.obento.outputs.label != ''
        env:
          LABEL: ${{ steps.obento.outputs.label }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "${LABEL}のお弁当を追加"
          # 同じころに別の写真がアップされていても大丈夫なように、数回やり直す
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

      - name: ブログの公開ページを更新する
        if: steps.obento.outputs.label != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
