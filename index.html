<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日の娘弁当</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Zen+Old+Mincho:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <p class="site-eyebrow">OBENTO DIARY</p>
      <h1 class="site-title">今日の娘弁当</h1>
      <p class="site-subtitle">美味しく健康でありますように</p>
    </div>
  </header>

  <main>
    <!-- プロフィール（小さめの紹介カード。アイコンは images/profile.png） -->
    <section class="profile">
      <img class="profile-icon" src="images/profile.png" alt="CHIRUのアイコン"
           onerror="this.style.display='none'">
      <div class="profile-body">
        <p class="profile-name"><span class="profile-leaf">🌿</span> CHIRU <span class="profile-leaf">🌿</span></p>
        <p class="profile-text">社会人の息子2人と、高校生の娘の母です😊
          家族の健康は毎日の食事から✨ 栄養バランスや彩りを大切にしながら、平日は娘のお弁当作りを楽しんでいます🍀
          食べる人が笑顔になれるお弁当を目指してコツコツ記録中🥰</p>
      </div>
    </section>

    <section class="calendar-panel">
      <nav class="cal-nav">
        <button id="prev-month" class="cal-btn" aria-label="前の月へ">&#8249;</button>
        <div class="cal-title">
          <span id="cal-month" class="cal-month">JUNE</span>
          <span id="cal-year" class="cal-year">2026</span>
        </div>
        <button id="next-month" class="cal-btn" aria-label="次の月へ">&#8250;</button>
      </nav>
      <div id="calendar" class="cal-grid"></div>
      <p id="cal-empty" class="cal-empty" hidden>この月のお弁当記録はまだありません</p>
    </section>
  </main>

  <footer class="site-footer">
    <p>きょうも おいしく たべてくれますように</p>
  </footer>

  <!-- 写真をクリックしたときに大きく表示する窓 -->
  <div id="photo-modal" class="modal" hidden>
    <div id="modal-backdrop" class="modal-backdrop"></div>
    <figure class="modal-box">
      <button id="modal-close" class="modal-close" aria-label="閉じる">&times;</button>
      <img id="modal-img" class="modal-img" src="" alt="">
      <figcaption class="modal-info">
        <p id="modal-date-en" class="modal-date-en"></p>
        <p id="modal-date-ja" class="modal-date-ja"></p>
        <p id="modal-comment" class="modal-comment"></p>
      </figcaption>
    </figure>
  </div>

  <!-- お弁当のデータを読み込みます -->
  <script src="obento.js"></script>
  <script>
    // ▼▼ ここから下はプログラムです。さわらなくて大丈夫です ▼▼

    // 日本の祝日（2026〜2029年・卒業まで対応）。自動でカレンダーに表示されます
    const HOLIDAYS = {
      "2026-01-01": "元日", "2026-01-12": "成人の日", "2026-02-11": "建国記念の日",
      "2026-02-23": "天皇誕生日", "2026-03-20": "春分の日", "2026-04-29": "昭和の日",
      "2026-05-03": "憲法記念日", "2026-05-04": "みどりの日", "2026-05-05": "こどもの日",
      "2026-05-06": "振替休日", "2026-07-20": "海の日", "2026-08-11": "山の日",
      "2026-09-21": "敬老の日", "2026-09-22": "国民の休日", "2026-09-23": "秋分の日",
      "2026-10-12": "スポーツの日", "2026-11-03": "文化の日", "2026-11-23": "勤労感謝の日",
      "2027-01-01": "元日", "2027-01-11": "成人の日", "2027-02-11": "建国記念の日",
      "2027-02-23": "天皇誕生日", "2027-03-21": "春分の日", "2027-03-22": "振替休日",
      "2027-04-29": "昭和の日", "2027-05-03": "憲法記念日", "2027-05-04": "みどりの日",
      "2027-05-05": "こどもの日", "2027-07-19": "海の日", "2027-08-11": "山の日",
      "2027-09-20": "敬老の日", "2027-09-23": "秋分の日", "2027-10-11": "スポーツの日",
      "2027-11-03": "文化の日", "2027-11-23": "勤労感謝の日",
      "2028-01-01": "元日", "2028-01-10": "成人の日", "2028-02-11": "建国記念の日",
      "2028-02-23": "天皇誕生日", "2028-03-20": "春分の日", "2028-04-29": "昭和の日",
      "2028-05-03": "憲法記念日", "2028-05-04": "みどりの日", "2028-05-05": "こどもの日",
      "2028-07-17": "海の日", "2028-08-11": "山の日", "2028-09-18": "敬老の日",
      "2028-09-22": "秋分の日", "2028-10-09": "スポーツの日", "2028-11-03": "文化の日",
      "2028-11-23": "勤労感謝の日",
      "2029-01-01": "元日", "2029-01-08": "成人の日", "2029-02-11": "建国記念の日",
      "2029-02-12": "振替休日", "2029-02-23": "天皇誕生日", "2029-03-20": "春分の日",
      "2029-04-29": "昭和の日", "2029-04-30": "振替休日", "2029-05-03": "憲法記念日",
      "2029-05-04": "みどりの日", "2029-05-05": "こどもの日", "2029-07-16": "海の日",
      "2029-08-11": "山の日", "2029-09-17": "敬老の日", "2029-09-23": "秋分の日",
      "2029-09-24": "振替休日", "2029-10-08": "スポーツの日", "2029-11-03": "文化の日",
      "2029-11-23": "勤労感謝の日"
    };

    const MONTHS_EN = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE",
                       "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];
    const WDAYS_EN = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
    const WDAYS_JA = ["日", "月", "火", "水", "木", "金", "土"];

    // "2026-6-8" のような書き方でも "2026-06-08" に揃える
    function normalizeKey(dateText) {
      const p = String(dateText).trim().split("-");
      if (p.length !== 3) return null;
      const y = Number(p[0]), m = Number(p[1]), d = Number(p[2]);
      if (!y || !m || !d) return null;
      return y + "-" + String(m).padStart(2, "0") + "-" + String(d).padStart(2, "0");
    }

    function nihongoDate(y, m, d) {
      const wd = WDAYS_JA[new Date(y, m - 1, d).getDay()];
      return y + "年" + m + "月" + d + "日（" + wd + "）";
    }

    function cafeDate(y, m, d) {
      const wd = WDAYS_EN[new Date(y, m - 1, d).getDay()];
      return MONTHS_EN[m - 1] + " " + d + ", " + y + " — " + wd;
    }

    // 日付 → お休みメモ の対応表を作る（obento.js の oyasumiList から）
    const noteByDate = {};
    if (typeof oyasumiList !== "undefined") {
      for (const o of oyasumiList) {
        const key = normalizeKey(o.date);
        if (key && o.note) noteByDate[key] = o.note;
      }
    }

    // 日付 → 記録 の対応表を作る
    const byDate = {};
    let minMonth = null, maxMonth = null; // 「年×12＋月」で月を数える
    if (typeof obentoList !== "undefined") {
      for (const o of obentoList) {
        const key = normalizeKey(o.date);
        if (!key) continue;
        byDate[key] = o;
        const y = Number(key.slice(0, 4)), m = Number(key.slice(5, 7));
        const idx = y * 12 + (m - 1);
        if (minMonth === null || idx < minMonth) minMonth = idx;
        if (maxMonth === null || idx > maxMonth) maxMonth = idx;
      }
    }

    // 今月もカレンダーを見られるようにしておく
    const today = new Date();
    const todayIdx = today.getFullYear() * 12 + today.getMonth();
    if (minMonth === null) minMonth = todayIdx;
    if (maxMonth === null) maxMonth = todayIdx;
    if (todayIdx > maxMonth) maxMonth = todayIdx;

    // 最初に表示する月（記録のある一番新しい月）
    let viewIdx = Math.min(maxMonth, todayIdx);

    const grid = document.getElementById("calendar");
    const emptyMsg = document.getElementById("cal-empty");
    const prevBtn = document.getElementById("prev-month");
    const nextBtn = document.getElementById("next-month");

    function render() {
      const y = Math.floor(viewIdx / 12);
      const m = (viewIdx % 12) + 1; // 1〜12

      document.getElementById("cal-month").textContent = MONTHS_EN[m - 1];
      document.getElementById("cal-year").textContent = y;
      prevBtn.disabled = viewIdx <= minMonth;
      nextBtn.disabled = viewIdx >= maxMonth;

      grid.innerHTML = "";

      // 曜日の見出し
      for (const wd of WDAYS_EN) {
        const el = document.createElement("div");
        el.className = "cal-wd";
        el.textContent = wd;
        grid.appendChild(el);
      }

      const firstWd = new Date(y, m - 1, 1).getDay();
      const daysInMonth = new Date(y, m, 0).getDate();

      // 1日より前の空きマス
      for (let i = 0; i < firstWd; i++) {
        const el = document.createElement("div");
        el.className = "cal-cell blank";
        grid.appendChild(el);
      }

      let count = 0;
      for (let d = 1; d <= daysInMonth; d++) {
        const cell = document.createElement("div");
        cell.className = "cal-cell";

        const key = y + "-" + String(m).padStart(2, "0") + "-" + String(d).padStart(2, "0");
        const entry = byDate[key];

        if (today.getFullYear() === y && today.getMonth() === m - 1 && today.getDate() === d) {
          cell.classList.add("today");
        }

        const num = document.createElement("span");
        num.className = "cal-daynum";
        num.textContent = d;
        cell.appendChild(num);

        // 写真 ＞ お休みメモ ＞ 祝日 の順で表示
        if (!entry && (noteByDate[key] || HOLIDAYS[key])) {
          const note = document.createElement("span");
          note.className = "cal-note" + (noteByDate[key] ? "" : " cal-holiday");
          note.textContent = noteByDate[key] || HOLIDAYS[key];
          cell.appendChild(note);
          cell.classList.add("has-note");
        }

        if (entry) {
          count++;
          cell.classList.add("has-photo");
          const img = document.createElement("img");
          img.className = "cal-photo";
          img.src = entry.photo;
          img.alt = nihongoDate(y, m, d) + "のお弁当";
          img.loading = "lazy";
          img.onerror = function () { this.onerror = null; this.src = "images/placeholder.svg"; };
          cell.appendChild(img);
          cell.addEventListener("click", function () { openModal(entry, y, m, d); });
          cell.setAttribute("role", "button");
          cell.tabIndex = 0;
          cell.addEventListener("keydown", function (e) {
            if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openModal(entry, y, m, d); }
          });
        }

        grid.appendChild(cell);
      }

      emptyMsg.hidden = count > 0;
    }

    prevBtn.addEventListener("click", function () { if (viewIdx > minMonth) { viewIdx--; render(); } });
    nextBtn.addEventListener("click", function () { if (viewIdx < maxMonth) { viewIdx++; render(); } });

    // ---------- 写真の拡大表示 ----------
    const modal = document.getElementById("photo-modal");
    const modalImg = document.getElementById("modal-img");

    function openModal(entry, y, m, d) {
      modalImg.src = entry.photo;
      modalImg.alt = nihongoDate(y, m, d) + "のお弁当";
      modalImg.onerror = function () { this.onerror = null; this.src = "images/placeholder.svg"; };
      document.getElementById("modal-date-en").textContent = cafeDate(y, m, d);
      document.getElementById("modal-date-ja").textContent = nihongoDate(y, m, d);
      const commentEl = document.getElementById("modal-comment");
      commentEl.textContent = entry.comment || "";
      commentEl.hidden = !entry.comment; // コメントが空の日は欄ごと隠す
      modal.hidden = false;
      document.body.style.overflow = "hidden"; // 後ろのページが動かないように
    }

    function closeModal() {
      modal.hidden = true;
      modalImg.src = "";
      document.body.style.overflow = "";
    }

    document.getElementById("modal-close").addEventListener("click", closeModal);
    document.getElementById("modal-backdrop").addEventListener("click", closeModal);
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && !modal.hidden) closeModal();
    });

    render();
  </script>
</body>
</html>
