<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- サンプル画像：日の丸弁当 -->
  <rect width="400" height="300" fill="#f7f5fb"/>
  <!-- ランチクロス -->
  <g opacity="0.35">
    <rect x="0" y="0" width="400" height="300" fill="#c9bce4"/>
    <g fill="#ffffff" opacity="0.5">
      <rect x="0" y="0" width="400" height="25"/><rect x="0" y="50" width="400" height="25"/>
      <rect x="0" y="100" width="400" height="25"/><rect x="0" y="150" width="400" height="25"/>
      <rect x="0" y="200" width="400" height="25"/><rect x="0" y="250" width="400" height="25"/>
      <rect x="0" y="0" width="25" height="300"/><rect x="50" y="0" width="25" height="300"/>
      <rect x="100" y="0" width="25" height="300"/><rect x="150" y="0" width="25" height="300"/>
      <rect x="200" y="0" width="25" height="300"/><rect x="250" y="0" width="25" height="300"/>
      <rect x="300" y="0" width="25" height="300"/><rect x="350" y="0" width="25" height="300"/>
    </g>
  </g>
  <!-- お弁当箱 -->
  <rect x="70" y="70" width="260" height="170" rx="24" fill="#8d7bb8"/>
  <rect x="84" y="84" width="232" height="142" rx="16" fill="#fffdf5"/>
  <!-- ごはん -->
  <ellipse cx="200" cy="155" rx="100" ry="56" fill="#ffffff" stroke="#f0e6d6" stroke-width="3"/>
  <!-- 梅干し -->
  <circle cx="200" cy="150" r="22" fill="#e8554f"/>
  <circle cx="193" cy="143" r="6" fill="#f08a86"/>
  <!-- ごま -->
  <g fill="#6b4f3a">
    <ellipse cx="150" cy="135" rx="4" ry="2" transform="rotate(20 150 135)"/>
    <ellipse cx="255" cy="140" rx="4" ry="2" transform="rotate(-15 255 140)"/>
    <ellipse cx="170" cy="180" rx="4" ry="2" transform="rotate(40 170 180)"/>
    <ellipse cx="240" cy="178" rx="4" ry="2" transform="rotate(-30 240 178)"/>
  </g>
  <text x="200" y="278" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#948f9e">（サンプル画像です。あとで本物の写真と入れかえてね）</text>
</svg>
